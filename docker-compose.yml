services:
  # ===========================================
  # MAIN APP: http://localhost:3000
  # ===========================================
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      # Locally, proxy to the Flask service by its compose name and port
      - BACKEND_URL=http://web:5000
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Dev Frontend for hot reload
  frontend_dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (accessed via frontend proxy, not directly)
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - LOG_DIR=/app/logs
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - backend_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Remove db dependency when using Supabase
    # depends_on:
    #   db:
    #     condition: service_healthy

  # Local PostgreSQL (optional - only needed if not using Supabase)
  # Uncomment if you want to use local database instead
