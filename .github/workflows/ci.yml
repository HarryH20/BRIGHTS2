name: CI

on:
  push:
    branches: [master, prod]
  pull_request:
    branches: [master, prod]

jobs:
  # ── Build & lint the React frontend ──────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Verify the Flask backend starts cleanly ──────────────────────
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verify imports and syntax
        run: python -c "from app import app; print('Flask app OK')"
        env:
          DATABASE_URL: "sqlite://"
          FLASK_SECRET_KEY: "ci-test-key"

  # ── Ensure Docker images build successfully ──────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t brights-frontend ./frontend

      - name: Build backend image
        run: docker build -t brights-backend ./backend
