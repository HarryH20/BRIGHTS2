name: CI

on:
  push:
    branches: [master, prod]
  pull_request:
    branches: [master, prod]

jobs:
  # ── Build & lint the React frontend ──────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Verify the Flask backend starts cleanly ──────────────────────
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verify imports and syntax
        run: python -c "from app import app; print('Flask app OK')"
        env:
          DATABASE_URL: "sqlite://"
          FLASK_SECRET_KEY: "ci-test-key"

  # ── Ensure Docker images build successfully ──────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t brights-frontend ./frontend

      - name: Build backend image
        run: docker build -t brights-backend -f backend/Dockerfile .

  # ── Deploy to Azure Container Apps (prod branch only) ────────────
  deploy:
    name: Deploy to Azure
    needs: [frontend, backend, docker]
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Build and push both images to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.ACR_NAME }}.azurecr.io/brights-backend:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/brights-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/brights-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/brights-frontend:${{ github.sha }}

      # Roll out new images to both Container Apps
      - name: Deploy backend
        run: |
          az containerapp update \
            --name brights-backend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/brights-backend:${{ github.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name brights-frontend \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/brights-frontend:${{ github.sha }}
